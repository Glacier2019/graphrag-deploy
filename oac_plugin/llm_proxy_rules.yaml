# LLM Proxy — 分类规则配置
# 场景：ChatAgent 调用 :11440，代理根据规则路由到 Ollama 或阿里云 API
# 修改此文件后需重启数字人生效

# ── 敏感词（Layer 1：命中后强制本地 Ollama，不记录日志）
sensitive_keywords:
  - "身份证"
  - "银行卡"
  - "密码"
  - "家庭地址"
  - "电话号码"
  - "住址"
  - "个人信息"
  - "社保"
  - "户口"
  - "病历"

# ── 明确简单（Layer 2 正则：命中后直接本地 Ollama）
simple_patterns:
  # 知识库查询
  - '(数据库|知识库|图谱|知识图谱)'
  # 计数类
  - '(几|多少).*(篇|个|条|文章|文档|实体|关系|人)'
  - '第.*篇'
  # 问候
  - '^(你好|早上好|晚上好|再见|拜拜|谢谢|嗨|哈[喽啰])'
  # 身份认知
  - '(你.*(叫|是).*(名字|谁|什么))'
  - '(你是谁|你叫什么)'
  # 时间
  - '(今天|现在|此刻).*(几点|星期|日期|时间)'
  # 视觉/环境
  - '(看到|看见|摄像头|镜头).*'
  # 简单确认
  - '^(好|对|是|行|嗯|可以|OK)$'
  # 短问句（<10字，兜底）
  - '^.{1,8}$'

# ── 明确复杂（Layer 2 正则：命中后走阿里云 API）
complex_patterns:
  # 比较分析
  - '比较.{1,30}(区别|不同|优劣|差异)'
  - '(对比|对比下).{1,30}'
  - '(区别|不同|差异).{1,10}(是什么|在哪里|在哪)'
  # 深度推理
  - '(分析|论证|证明|推导|解释).{3,30}'
  - '(为什么).{3,30}(原因|机制|原理|本质)'
  # 创作
  - '(写|编|创作|生成).{1,20}(诗|故事|文章|作文|代码|文案|剧本)'
  # 总结
  - '(总结|概括|归纳|汇总).{3,30}'
  # 翻译
  - '(翻译|translate|翻).{1,20}'
  # 区别类（无"比较"前缀也匹配）
  - '.*(区别|不同|优劣|差异).*(是什么|在哪里)'

# ── 小模型兜底分类（Layer 3：前两层未命中时使用）
classifier:
  enabled: true
  model: "qwen2.5:0.5b-4k"
  api_url: "http://localhost:11434/v1"
  timeout: 5.0  # 冷启动首次需2-3秒，后续<100ms
  prompt: |
    判断以下用户输入的复杂度，只回答一个词：
    - simple: 简单事实查询、闲聊、问候、确认
    - complex: 需要深度推理、比较分析、创作、或领域专业知识

    用户输入：
    {text}

    回答：

# ── 后端配置
backends:
  local:
    url: "http://localhost:11434/v1"
    model: "qwen3:14b-8k"
    label: "ollama-local"
  remote:
    url: "https://api.deepseek.com/v1"
    model: "deepseek-v4-flash"
    label: "deepseek-api"
    timeout: 3.0       # API 超时（秒），超时后 fallback 本地
    api_key_env: "DEEPSEEK_API_KEY"

# ── 代理端口
proxy:
  host: "127.0.0.1"
  port: 11440
